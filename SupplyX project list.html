<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupplyX project list</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root { --ink: #14213d; --muted: #657184; --line: #dbe2ea; --paper: #f4f7f9; --blue: #075d9b; --teal: #007f78; --amber: #c56a00; --red: #a42e30; }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 12px/1.35 "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; min-height: 58px; padding: 8px max(18px, calc((100vw - 1440px) / 2)); color: white; background: linear-gradient(110deg, #123d66, #087b83); }
    h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0; }
    .brand { display: flex; align-items: center; gap: 9px; }.brand-mark { position: relative; width: 33px; height: 29px; border-radius: 8px; background: linear-gradient(135deg, #ffbb38, #ff2e77 52%, #663cc8); box-shadow: inset 0 0 0 1px #ffffff44; }.brand-mark::before { position: absolute; inset: 8px 7px; border-radius: 4px; background: white; content: ""; }.brand-mark::after { position: absolute; top: 12px; left: 11px; width: 4px; height: 4px; border-radius: 50%; background: #202d3e; box-shadow: 9px 0 #202d3e; content: ""; }.brand-word { font-size: 22px; font-weight: 800; letter-spacing: 0; }.brand-word .supply { color: #ff5a64; }.brand-word .x { color: #8755df; }
    main { max-width: 1440px; margin: 0 auto; padding: 10px 18px 18px; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(118px, 1fr)) minmax(250px, 1.55fr); gap: 8px; margin-bottom: 8px; }
    .metric { position: relative; min-width: 0; padding: 8px 11px; border-left: 3px solid var(--blue); background: white; box-shadow: 0 1px 2px #18334d12; }.metric b { display: block; font-size: 19px; line-height: 1.05; }.metric span { color: var(--muted); font-size: 11px; }.metric .metric-icon { position: absolute; top: 9px; right: 10px; width: 18px; color: #77abc8; stroke-width: 1.8; }
    .chart { display: grid; grid-template-columns: auto 1fr; gap: 11px; align-items: center; padding: 7px 11px; background: white; border-left: 3px solid var(--teal); box-shadow: 0 1px 2px #18334d12; }.chart-title { display: grid; gap: 2px; color: var(--muted); font-size: 11px; }.chart-title svg { width: 17px; color: var(--teal); stroke-width: 1.8; }.chart-bars { display: grid; gap: 4px; }.chart-row { display: grid; grid-template-columns: 58px 1fr 24px; gap: 6px; align-items: center; color: #526276; font-size: 10px; }.bar-track { height: 7px; overflow: hidden; border-radius: 3px; background: #e7edf2; }.bar { height: 100%; min-width: 2px; border-radius: inherit; background: #0f7f78; }.bar.progress { background: #1778b5; }.bar.pending { background: #cb8a1c; }.bar.cancelled { background: #a74345; }
    .filters { display: grid; grid-template-columns: minmax(210px, 2fr) repeat(4, minmax(110px, 1fr)) auto; gap: 7px; align-items: end; padding: 9px; background: white; border: 1px solid var(--line); }
    label { display: grid; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; }
    input, select, button { min-height: 30px; border: 1px solid #c8d3df; border-radius: 4px; color: var(--ink); background: white; font: inherit; }
    input, select { padding: 0 10px; } button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; cursor: pointer; font-weight: 600; } button svg, .file-button svg { width: 14px; height: 14px; stroke-width: 2; } button:hover { background: #eef6fa; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 7px 0 0; }.primary { color: white; border-color: var(--blue); background: var(--blue); }.primary:hover { background: #064d80; }.save-status { align-self: center; color: var(--muted); font-size: 11px; }.file-button { display: inline-flex; align-items: center; min-height: 30px; gap: 6px; padding: 0 10px; border: 1px solid #c8d3df; border-radius: 4px; cursor: pointer; font-weight: 600; }.file-button:hover { background: #eef6fa; }.table-wrap { margin-top: 7px; overflow: hidden; background: white; border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 2px 8px #18334d12; }
    table { width: 100%; table-layout: fixed; border-collapse: collapse; } th { position: sticky; top: 0; z-index: 1; padding: 8px 7px; color: #35516a; background: #edf3f6; border-bottom: 1px solid var(--line); text-align: left; font-size: 10px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } td { height: 40px; padding: 7px; overflow: hidden; border-bottom: 1px solid #e8edf1; vertical-align: middle; white-space: nowrap; text-overflow: ellipsis; } th:last-child, td:last-child { width: 66px; } tbody tr { cursor: pointer; transition: background .15s ease; } tbody tr:nth-child(even) { background: #fbfcfd; } tbody tr:hover { background: #eef8f7; } .requirement { width: 17%; font-weight: 700; color: #113d61; } .note { color: #536478; }
    .tag { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 11px; font-weight: 700; white-space: nowrap; }.priority-高 { color: #861d20; background: #fde9e8; }.priority-中 { color: #875800; background: #fff2cf; }.priority-低 { color: #286a55; background: #e5f5ed; }.status-Completed { color: #0b685c; background: #dff5ed; }.status-Cancelled, .status-Canceled { color: #8b3537; background: #f8e8e8; }.status-In-Progress { color: #095f97; background: #e1f0fa; }.status-Not-Started { color: #78600b; background: #fbf4d8; }.row-actions { display: flex; gap: 4px; }.row-actions button { width: 27px; min-width: 27px; min-height: 27px; padding: 0; }.row-actions button svg { width: 13px; height: 13px; }.danger { color: var(--red); border-color: #e8c3c4; }.danger:hover { background: #fff0f0; }
    .empty, .loading { padding: 36px 20px; color: var(--muted); text-align: center; }.hint { margin: 6px 0 0; color: var(--muted); font-size: 11px; }.hidden { display: none; }
    dialog { width: min(780px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 0; box-shadow: 0 18px 50px #10263d55; } dialog::backdrop { background: #102b4166; }.detail-head { display: flex; align-items: start; justify-content: space-between; gap: 16px; padding: 22px 24px; color: white; background: #0d526f; }.detail-head h2 { margin: 0; font-size: 21px; }.detail-body { padding: 22px 24px 28px; }.detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }.field { padding-bottom: 10px; border-bottom: 1px solid var(--line); }.field b { display: block; color: var(--muted); font-size: 11px; }.detail-note { margin-top: 18px; }.detail-note p { margin: 5px 0 0; white-space: pre-wrap; }.close { width: 34px; padding: 0; color: white; border-color: #ffffff66; background: transparent; font-size: 20px; }.form-body { padding: 22px 24px; }.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }.form-grid label { font-size: 12px; }.form-grid textarea { min-height: 84px; padding: 8px 10px; border: 1px solid #c8d3df; border-radius: 4px; resize: vertical; font: inherit; }.form-grid .wide { grid-column: 1 / -1; }.form-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 24px 24px; }
    @media (max-width: 1180px) { th:nth-child(4), td:nth-child(4), th:nth-child(7), td:nth-child(7), th:nth-child(8), td:nth-child(8), th:nth-child(9), td:nth-child(9), th:nth-child(12), td:nth-child(12) { display: none; }.requirement { width: 25%; } } @media (max-width: 980px) { .summary { grid-template-columns: repeat(4, 1fr); }.chart { grid-column: 1 / -1; }.filters { grid-template-columns: 1fr 1fr; }.filters label:first-child { grid-column: 1 / -1; } th, td { padding: 6px 5px; } } @media (max-width: 700px) { th:nth-child(3), td:nth-child(3), th:nth-child(6), td:nth-child(6), th:nth-child(10), td:nth-child(10) { display: none; }.requirement { width: 42%; } } @media (max-width: 600px) { header { padding: 8px 12px; }.brand-word { font-size: 19px; } main { padding: 8px 10px; }.summary { grid-template-columns: 1fr 1fr; }.chart { grid-column: 1 / -1; }.detail-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <header><div class="brand" aria-label="SupplyX"><span class="brand-mark" aria-hidden="true"></span><h1 class="brand-word"><span class="supply">Supply</span><span class="x">X</span></h1></div></header>
  <main>
    <section class="summary" id="summary"></section>
    <section class="filters">
      <label>Search requirements or notes<input id="search" type="search" placeholder="Requirement, owner, or keyword"></label>
      <label>Function<select id="function"><option value="">All</option></select></label>
      <label>Owner<select id="focal"><option value="">All</option></select></label>
      <label>Priority<select id="priority"><option value="">All</option></select></label>
      <label>Status<select id="status"><option value="">All</option></select></label>
      <button id="reset" type="button"><i data-lucide="rotate-ccw"></i>Reset</button>
    </section>
    <section class="actions">
      <button id="add" class="primary" type="button"><i data-lucide="plus"></i>Add requirement</button>
      <button id="save" type="button"><i data-lucide="save"></i>Save changes</button>
      <label class="file-button"><i data-lucide="upload"></i>Upload Excel<input id="upload" type="file" accept=".xlsx,.xls" hidden></label>
      <button id="export" type="button"><i data-lucide="download"></i>Export table</button>
      <span class="save-status" id="save-status" role="status"></span>
    </section>
    <p class="hint" id="count"></p>
    <section class="table-wrap"><div class="loading" id="loading">Loading requirements...</div><table class="hidden" id="table"><thead><tr><th>Requirement ID</th><th>Requirement</th><th>Function</th><th>Category</th><th>Owner</th><th>Priority</th><th>Complexity</th><th>IT Type</th><th>MD</th><th>Delivery</th><th>Status</th><th>Business Notes</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section>
  </main>
  <dialog id="detail"><div class="detail-head"><div><h2 id="detail-title"></h2><span id="detail-task"></span></div><button class="close" id="close" aria-label="Close">×</button></div><div class="detail-body" id="detail-body"></div></dialog>
  <dialog id="editor"><form id="editor-form" method="dialog"><div class="detail-head"><div><h2 id="editor-title">Add requirement</h2><span>Cost fields are not saved or exported</span></div><button class="close" id="editor-close" type="button" aria-label="Close">×</button></div><div class="form-body"><div class="form-grid" id="editor-fields"></div></div><div class="form-actions"><button id="cancel" type="button">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
  <script>
    const workbookFile = 'requirements-data.xlsx';
    const storageKey = 'supplyx-project-list-v1';
    const fields = { 0: 'id', 1: 'function', 2: 'requirement', 3: 'businessNote', 4: 'category', 5: 'focal', 6: 'priority', 7: 'rank', 8: 'difficulty', 9: 'itType', 10: 'itNote', 11: 'md', 12: 'deliveryYear', 19: 'taskName', 20: 'deliveryQuarter', 21: 'startDate', 22: 'endDate', 23: 'status', 24: 'statusRemark', 25: 'plannedStart', 26: 'plannedEnd' };
    const exportColumns = [['id', 'Requirement ID'], ['requirement', 'Requirement'], ['function', 'Function'], ['category', 'Category'], ['focal', 'Owner'], ['priority', 'Priority'], ['rank', 'Rank'], ['difficulty', 'Complexity'], ['itType', 'IT Type'], ['md', 'MD'], ['deliveryYear', 'Delivery Year'], ['deliveryQuarter', 'Delivery Quarter'], ['taskName', 'Task Name'], ['startDate', 'Actual Start'], ['endDate', 'Actual End'], ['plannedStart', 'Planned Start'], ['plannedEnd', 'Planned End'], ['status', 'Status'], ['businessNote', 'Business Notes'], ['itNote', 'IT Notes'], ['statusRemark', 'Status Notes']];
    const editorFields = [['id', 'Requirement ID'], ['requirement', 'Requirement'], ['function', 'Function'], ['category', 'Category'], ['focal', 'Owner'], ['priority', 'Priority'], ['rank', 'Rank'], ['difficulty', 'Complexity'], ['itType', 'IT Type'], ['md', 'MD'], ['deliveryYear', 'Delivery Year'], ['deliveryQuarter', 'Delivery Quarter'], ['taskName', 'Task Name'], ['startDate', 'Actual Start'], ['endDate', 'Actual End'], ['plannedStart', 'Planned Start'], ['plannedEnd', 'Planned End'], ['status', 'Status'], ['businessNote', 'Business Notes'], ['itNote', 'IT Notes'], ['statusRemark', 'Status Notes']];
    let requirements = [];
    let autosaveTimer;
    const $ = (id) => document.getElementById(id);
    const text = (value) => value == null ? '' : String(value).trim();
    const normalizeStatus = (value) => text(value).toLowerCase() === 'canceled' ? 'Cancelled' : text(value);
    const display = (value) => ({ '高': 'High', '中': 'Medium', '低': 'Low', '平台': 'Platform', '自动化': 'Automation' }[text(value)] || text(value));
    const escape = (value) => text(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
    const tag = (value, type) => value ? `<span class="tag ${type}-${escape(value).replaceAll(' ', '-')}">${escape(display(value))}</span>` : '—';
    const unique = (key) => [...new Set(requirements.map((item) => item[key]).filter(Boolean))].sort();
    const projectKey = (item, index) => item.id ? `id:${item.id}` : `row:${index}`;
    const projectCount = (items, predicate = () => true) => new Set(items.map((item, index) => predicate(item) ? projectKey(item, index) : null).filter(Boolean)).size;
    function renderIcons() { if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } }); }
    function refreshFilters() { ['function','focal','priority','status'].forEach((key) => { const selected = $(key).value; $(key).innerHTML = '<option value="">All</option>' + unique(key).map((value) => `<option value="${escape(value)}">${escape(display(value))}</option>`).join(''); $(key).value = unique(key).includes(selected) ? selected : ''; }); }
    function currentRows() { const search = $('search').value.toLowerCase(); return requirements.filter((item) => (!search || Object.values(item).join(' ').toLowerCase().includes(search)) && ['function','focal','priority','status'].every((key) => !$(key).value || item[key] === $(key).value)); }
    function renderSummary(rows = currentRows()) { const totalProjects = projectCount(rows); const completed = projectCount(rows, (item) => item.status === 'Completed'); const progressing = projectCount(rows, (item) => item.status === 'In Progress'); const pending = projectCount(rows, (item) => item.status === 'Not Started'); const cancelled = projectCount(rows, (item) => item.status === 'Cancelled'); const total = totalProjects || 1; const functionCount = new Set(rows.map((item) => item.function).filter(Boolean)).size; const chartRow = (label, amount, style) => `<div class="chart-row"><span>${label}</span><div class="bar-track"><div class="bar ${style}" style="width:${(amount / total) * 100}%"></div></div><b>${amount}</b></div>`; $('summary').innerHTML = [{ n: totalProjects, t: 'Active projects', icon: 'clipboard-list' }, { n: completed, t: 'Completed', icon: 'circle-check-big' }, { n: progressing, t: 'In progress', icon: 'timer' }, { n: functionCount, t: 'Business functions', icon: 'boxes' }].map((item) => `<div class="metric"><i class="metric-icon" data-lucide="${item.icon}"></i><b>${item.n}</b><span>${item.t}</span></div>`).join('') + `<div class="chart"><span class="chart-title"><i data-lucide="chart-no-axes-combined"></i>Project status distribution</span><div class="chart-bars">${chartRow('Completed', completed, '')}${chartRow('In progress', progressing, 'progress')}${chartRow('Not started', pending, 'pending')}${chartRow('Cancelled', cancelled, 'cancelled')}</div></div>`; renderIcons(); }
    function render() { const rows = currentRows(); renderSummary(rows); $('count').textContent = `Showing ${rows.length} of ${requirements.length} requirements. Select a row for full details and schedule information.`; $('rows').innerHTML = rows.map((item) => { const index = requirements.indexOf(item); return `<tr data-index="${index}"><td>${escape(item.id) || `REQ-${String(index + 1).padStart(3, '0')}`}</td><td class="requirement">${escape(item.taskName || item.requirement)}</td><td>${escape(item.function) || '—'}</td><td>${escape(item.category) || '—'}</td><td>${escape(item.focal) || '—'}</td><td>${tag(item.priority, 'priority')}</td><td>${escape(display(item.difficulty)) || '—'}</td><td>${escape(display(item.itType)) || '—'}</td><td>${escape(item.md) || '—'}</td><td>${escape(item.deliveryQuarter || item.deliveryYear) || '—'}</td><td>${tag(item.status, 'status')}</td><td class="note">${escape(item.businessNote) || '—'}</td><td><div class="row-actions"><button data-edit="${index}" type="button" title="Edit requirement" aria-label="Edit requirement"><i data-lucide="pencil"></i></button><button data-delete="${index}" class="danger" type="button" title="Delete requirement" aria-label="Delete requirement"><i data-lucide="trash-2"></i></button></div></td></tr>`; }).join('') || '<tr><td colspan="13" class="empty">No requirements match the current filters.</td></tr>'; [...$('rows').querySelectorAll('tr[data-index]')].forEach((row) => row.addEventListener('click', () => showDetail(requirements[Number(row.dataset.index)]))); [...$('rows').querySelectorAll('[data-edit]')].forEach((button) => button.addEventListener('click', (event) => { event.stopPropagation(); openEditor(Number(button.dataset.edit)); })); [...$('rows').querySelectorAll('[data-delete]')].forEach((button) => button.addEventListener('click', (event) => { event.stopPropagation(); const index = Number(button.dataset.delete); if (confirm(`Delete “${requirements[index].requirement}”?`)) { requirements.splice(index, 1); updatePage(); } })); renderIcons(); }
    function showDetail(item) { const field = (label, value) => `<div class="field"><b>${label}</b><span>${escape(value) || '—'}</span></div>`; $('detail-title').textContent = item.requirement; $('detail-task').textContent = item.taskName || ''; $('detail-body').innerHTML = `<div class="detail-grid">${field('Function', item.function)}${field('Category', item.category)}${field('Owner', item.focal)}${field('Priority', item.priority)}${field('Rank', item.rank)}${field('Complexity', item.difficulty)}${field('IT Type', item.itType)}${field('MD', item.md)}${field('Delivery Quarter', item.deliveryQuarter || item.deliveryYear)}${field('Actual Start', item.startDate)}${field('Actual End', item.endDate)}${field('Status', item.status)}${field('Planned Start', item.plannedStart)}${field('Planned End', item.plannedEnd)}</div><div class="detail-note"><b>Business Notes</b><p>${escape(item.businessNote) || '—'}</p></div><div class="detail-note"><b>IT Notes</b><p>${escape(item.itNote) || '—'}</p></div><div class="detail-note"><b>Status Notes</b><p>${escape(item.statusRemark) || '—'}</p></div>`; $('detail').showModal(); }
    function mapRows(values) { const header = values[0].map(text); const exported = (header.includes('Requirement ID') && header.includes('Requirement')) || (header.includes('需求编号') && header.includes('需求')); return values.slice(1).map((row) => { const item = {}; if (exported) exportColumns.forEach(([key, label]) => item[key] = text(row[header.indexOf(label)])); else Object.entries(fields).forEach(([column, key]) => item[key] = text(row[Number(column)])); item.status = normalizeStatus(item.status); return item; }).filter((item) => item.requirement); }
    function saveChanges(message = 'Saved') { localStorage.setItem(storageKey, JSON.stringify(requirements)); $('save-status').textContent = `${message} ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`; }
    function updatePage(message) { requirements = requirements.map((item) => ({ ...item, status: normalizeStatus(item.status) })); saveChanges(message); refreshFilters(); renderSummary(); render(); $('loading').classList.add('hidden'); $('table').classList.remove('hidden'); }
    function openEditor(index) { const item = index === undefined ? Object.fromEntries(editorFields.map(([key]) => [key, ''])) : requirements[index]; $('editor-title').textContent = index === undefined ? 'Add requirement' : 'Edit requirement'; $('editor-form').dataset.index = index ?? ''; $('editor-fields').innerHTML = editorFields.map(([key, label]) => { const wide = ['businessNote', 'itNote', 'statusRemark'].includes(key); const control = wide ? `<textarea id="field-${key}" name="${key}">${escape(item[key])}</textarea>` : `<input id="field-${key}" name="${key}" value="${escape(item[key])}" ${key === 'requirement' ? 'required' : ''}>`; return `<label class="${wide ? 'wide' : ''}">${label}${control}</label>`; }).join(''); $('editor').showModal(); }
    function saveEditor(close = false) { const form = $('editor-form'); const item = Object.fromEntries(editorFields.map(([key]) => [key, text(new FormData(form).get(key))])); const index = form.dataset.index; if (index === '') { if (!item.requirement) return; requirements.push(item); form.dataset.index = requirements.length - 1; } else requirements[Number(index)] = item; updatePage(close ? 'Saved' : 'Autosaved'); if (close) $('editor').close(); }
    function exportWorkbook() { const data = [exportColumns.map(([, label]) => label), ...requirements.map((item) => exportColumns.map(([key]) => item[key] || ''))]; const sheet = XLSX.utils.aoa_to_sheet(data); const workbook = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(workbook, sheet, 'Project List'); XLSX.writeFile(workbook, 'SupplyX-project-list.xlsx'); }
    async function uploadWorkbook(file) { const workbook = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true }); const sheet = workbook.Sheets['需求评估'] || workbook.Sheets['需求清单'] || workbook.Sheets['Project List'] || workbook.Sheets[workbook.SheetNames[0]]; const data = mapRows(XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false })); if (!data.length) throw new Error('No recognizable requirement data was found in the uploaded workbook.'); requirements = data; updatePage(); }
    async function load() { try { const saved = localStorage.getItem(storageKey); if (saved) { requirements = JSON.parse(saved); updatePage(); return; } const response = await fetch(encodeURI(workbookFile)); if (!response.ok) throw new Error(`Unable to read workbook (${response.status})`); const workbook = XLSX.read(await response.arrayBuffer(), { type: 'array', cellDates: true }); const sheet = workbook.Sheets['需求评估']; if (!sheet) throw new Error('The Requirements Assessment worksheet was not found.'); requirements = mapRows(XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false })); updatePage(); } catch (error) { $('loading').innerHTML = `Unable to load the workbook: ${escape(error.message)}<br><small>Open this page through a local web server and make sure the Excel file is in the same folder.</small>`; } }
    ['search','function','focal','priority','status'].forEach((id) => $(id).addEventListener('input', render)); $('reset').addEventListener('click', () => { ['search','function','focal','priority','status'].forEach((id) => $(id).value = ''); render(); }); $('close').addEventListener('click', () => $('detail').close()); $('add').addEventListener('click', () => openEditor()); $('save').addEventListener('click', () => saveChanges('Saved')); $('editor-close').addEventListener('click', () => $('editor').close()); $('cancel').addEventListener('click', () => $('editor').close()); $('editor-form').addEventListener('input', () => { clearTimeout(autosaveTimer); autosaveTimer = setTimeout(() => saveEditor(), 500); }); $('editor-form').addEventListener('submit', (event) => { event.preventDefault(); clearTimeout(autosaveTimer); saveEditor(true); }); $('export').addEventListener('click', exportWorkbook); $('upload').addEventListener('change', async (event) => { const [file] = event.target.files; if (!file) return; try { await uploadWorkbook(file); } catch (error) { alert(`Upload failed: ${error.message}`); } finally { event.target.value = ''; } }); renderIcons(); load();
  </script>
</body>
</html>
